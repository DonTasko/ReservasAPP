<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Faturas | Don Tasko</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c96a; --gold-dim: rgba(201,168,76,0.12);
  --dark: #0f0e0c; --surface: #1a1815; --surface2: #242018; --border: #2e2b22;
  --text: #f0ead6; --text-muted: #8a8070; --text-dim: #504a3e;
  --success: #2e7d52; --success-dim: rgba(46,125,82,0.15);
  --red: #c0392b; --red-dim: rgba(192,57,43,0.15);
  --blue: #2980b9; --blue-dim: rgba(41,128,185,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header-brand { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 900; color: var(--gold); }
.header-right { display: flex; gap: 8px; }
.btn-top { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-top:hover { border-color: var(--gold); color: var(--gold); }

.main { max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; text-align: center; transition: all 0.2s; }
.tab.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

.panel { display: none; }
.panel.active { display: block; }

.scanner-wrap { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1; margin-bottom: 16px; }
#video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.scanner-frame { width: 65%; aspect-ratio: 1; border: 3px solid var(--gold); border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); position: relative; }
.scanner-line { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(to right, transparent, var(--gold), transparent); animation: scan 2s linear infinite; }
@keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
.scanner-hint { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,0.7); }

.scanner-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.scanner-btns.single { grid-template-columns: 1fr; }
.btn-scanner { width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.2s; }
.btn-start  { background: var(--gold); color: var(--dark); }
.btn-start:hover  { background: var(--gold-light); }
.btn-upload { background: var(--blue-dim); border: 1px solid rgba(41,128,185,0.4); color: #3498db; }
.btn-upload:hover { background: rgba(41,128,185,0.2); }
.btn-stop   { background: var(--red-dim); border: 1px solid rgba(192,57,43,0.4); color: #e74c3c; }

.img-preview-wrap { width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface2); border: 1px solid var(--border); margin-bottom: 16px; display: none; }
.img-preview-wrap.show { display: block; }
#imgPreview { width: 100%; max-height: 300px; object-fit: contain; display: block; }
.img-status { padding: 10px 14px; font-size: 12px; text-align: center; }
.img-status.ok    { color: #4caf82; }
.img-status.error { color: #e74c3c; }
.img-status.wait  { color: var(--text-muted); }

.qr-resultado { background: var(--success-dim); border: 1px solid rgba(46,125,82,0.4); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; display: none; }
.qr-resultado.show { display: block; }
.qr-resultado-title { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #4caf82; font-weight: 700; margin-bottom: 6px; }
.qr-resultado-text { font-size: 12px; color: var(--text-muted); word-break: break-all; }

.section-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; }
.field input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 9px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
.field input:focus { outline: none; border-color: var(--gold); }
.field input::placeholder { color: var(--text-dim); }
.field input.auto { border-color: rgba(46,125,82,0.5); background: rgba(46,125,82,0.05); }
.field-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.btn-guardar { width: 100%; background: var(--gold); color: var(--dark); border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all 0.2s; margin-top: 8px; }
.btn-guardar:hover { background: var(--gold-light); }
.btn-limpar { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 11px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
.btn-limpar:hover { border-color: var(--red); color: #e74c3c; }

.filtro-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filtro-row input { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 13px; font-family: inherit; }
.filtro-row input:focus { outline: none; border-color: var(--gold); }

.fatura-item { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: border-color 0.2s; }
.fatura-item:hover { border-color: var(--gold); }
.fatura-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.fatura-numero { font-size: 13px; font-weight: 700; color: var(--text); }
.fatura-total { font-size: 14px; font-weight: 700; color: var(--gold); white-space: nowrap; }
.fatura-fornecedor { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.fatura-data { font-size: 11px; color: var(--text-dim); }
.fatura-ivas { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.iva-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 11px; color: var(--text-muted); }

.stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.stat-val { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

.empty-msg { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--gold); margin-bottom: 16px; }
.modal-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.modal-row:last-of-type { border-bottom: none; }
.modal-key { color: var(--text-muted); }
.modal-val { font-weight: 600; color: var(--text); text-align: right; }
.modal-btns { display: flex; gap: 10px; margin-top: 16px; }
.btn-apagar { flex: 1; background: var(--red-dim); border: 1px solid rgba(192,57,43,0.4); color: #e74c3c; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-fechar { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 11px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }

#loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; justify-content: center; align-items: center; flex-direction: column; gap: 12px; }
#loading.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
.loading-msg { font-size: 13px; color: var(--text-muted); }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; font-size: 13px; font-weight: 600; z-index: 400; opacity: 0; transition: all 0.3s; white-space: nowrap; max-width: 90vw; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.ok    { border-color: var(--success); color: #4caf82; }
.toast.error { border-color: var(--red); color: #e74c3c; }
</style>
<script src="config.js"></script>
</head>
<body>

<div class="header">
  <div class="header-brand">🧾 FATURAS</div>
  <div class="header-right">
    <a href="faturas-calendario.html" class="btn-top">📅 Calendário</a>
    <a href="admin.html" class="btn-top">← Admin</a>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="setTab('scanner', this)">📷 Scanner QR</button>
    <button class="tab" onclick="setTab('lista', this)">📋 Lista</button>
  </div>

  <!-- SCANNER -->
  <div class="panel active" id="panel-scanner">

    <div class="scanner-wrap" id="scannerWrap" style="display:none">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="scanner-overlay">
        <div class="scanner-frame"><div class="scanner-line"></div></div>
      </div>
      <div class="scanner-hint">Aponte para o QR code da fatura</div>
    </div>

    <div class="img-preview-wrap" id="imgPreviewWrap">
      <img id="imgPreview" src="" alt="">
      <div class="img-status wait" id="imgStatus">A processar QR code...</div>
    </div>

    <div class="scanner-btns" id="btnsIniciar">
      <button class="btn-scanner btn-start" onclick="iniciarScanner()">📷 Câmara</button>
      <button class="btn-scanner btn-upload" onclick="document.getElementById('inputImagem').click()">🖼️ Imagem / Screenshot</button>
    </div>
    <div class="scanner-btns single" id="btnParar" style="display:none">
      <button class="btn-scanner btn-stop" onclick="pararScanner()">⏹ Parar Câmara</button>
    </div>
    <input type="file" id="inputImagem" accept="image/*" style="display:none" onchange="lerImagem(event)">

    <div class="qr-resultado" id="qrResultado">
      <div class="qr-resultado-title">✅ QR Code detectado</div>
      <div class="qr-resultado-text" id="qrTexto"></div>
    </div>

    <div class="section-title">Dados da Fatura</div>

    <div class="field-row">
      <div class="field"><label>Data *</label><input type="date" id="fData"></div>
      <div class="field"><label>Nº Fatura *</label><input type="text" id="fNumero" placeholder="FT 2024/123"></div>
    </div>
    <div class="field"><label>NIF Fornecedor</label><input type="text" id="fNif" placeholder="123456789"></div>
    <div class="field"><label>Fornecedor *</label><input type="text" id="fFornecedor" placeholder="Nome do fornecedor"></div>
    <div class="field-row-3">
      <div class="field"><label>Base Trib. (€)</label><input type="number" id="fBase" placeholder="0.00" step="0.01" min="0"></div>
      <div class="field"><label>IVA (€)</label><input type="number" id="fIva" placeholder="0.00" step="0.01" min="0"></div>
      <div class="field"><label>Total (€) *</label><input type="number" id="fTotal" placeholder="0.00" step="0.01" min="0"></div>
    </div>
    <div class="field"><label>Notas</label><input type="text" id="fNotas" placeholder="Observações opcionais"></div>

    <button class="btn-guardar" onclick="guardarFatura()">💾 Registar Fatura</button>
    <button class="btn-limpar" onclick="limparForm()">🗑️ Limpar</button>
  </div>

  <!-- LISTA -->
  <div class="panel" id="panel-lista">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-val" id="statTotal">0</div><div class="stat-lbl">Faturas</div></div>
      <div class="stat-card"><div class="stat-val" id="statValor">0 €</div><div class="stat-lbl">Total</div></div>
    </div>
    <div class="filtro-row">
      <input type="month" id="filtroMes" onchange="carregarLista()">
      <input type="text" id="filtroTexto" placeholder="Pesquisar..." oninput="filtrarLista()">
    </div>
    <div id="listaFaturas"><div class="empty-msg">A carregar...</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-title">🧾 Detalhe da Fatura</div>
    <div id="modalConteudo"></div>
    <div class="modal-btns">
      <button class="btn-apagar" onclick="apagarFatura()">🗑️ Apagar</button>
      <button class="btn-fechar" onclick="fecharModalDireto()">Fechar</button>
    </div>
  </div>
</div>

<div id="loading"><div class="spinner"></div><div class="loading-msg" id="loadingMsg">A processar...</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ── VARIÁVEIS GLOBAIS ──
let stream        = null;
let scanInterval  = null;
let todasFaturas  = [];
let faturaSelId   = null;

// ── TABS ──
function setTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'lista') carregarLista();
}

// ── UTILS ──
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'ok') + ' show';
  setTimeout(() => t.classList.remove('show'), 3500);
}

function setLoading(on, msg) {
  document.getElementById('loading').classList.toggle('show', on);
  if (msg) document.getElementById('loadingMsg').textContent = msg;
}

function setAutoField(id, valor) {
  const el = document.getElementById(id);
  el.value = valor;
  el.classList.add('auto');
}

// ── CÂMARA ──
async function iniciarScanner() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1280 } }
    });
    document.getElementById('video').srcObject = stream;
    document.getElementById('scannerWrap').style.display = 'block';
    document.getElementById('imgPreviewWrap').classList.remove('show');
    document.getElementById('btnsIniciar').style.display = 'none';
    document.getElementById('btnParar').style.display = 'block';
    setTimeout(() => {
      scanInterval = setInterval(lerQRCamara, 300);
    }, 1500);
  } catch(e) {
    showToast('Erro ao aceder à câmara: ' + e.message, 'error');
  }
}

function pararScanner() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  document.getElementById('scannerWrap').style.display = 'none';
  document.getElementById('btnsIniciar').style.display = 'grid';
  document.getElementById('btnParar').style.display = 'none';
}

function lerQRCamara() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
  if (video.videoWidth === 0 || video.videoHeight === 0) return;
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  // Verificar se imagem não é preta
  let soma = 0;
  for (let i = 0; i < imageData.data.length; i += 40) soma += imageData.data[i];
  if (soma / (imageData.data.length / 40) < 5) return;
  const code = jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: 'dontInvert' });
  if (code) { pararScanner(); processarQR(code.data); }
}

// ── UPLOAD IMAGEM ──
function lerImagem(event) {
  const file = event.target.files[0];
  if (!file) return;

  const wrap    = document.getElementById('imgPreviewWrap');
  const preview = document.getElementById('imgPreview');
  const status  = document.getElementById('imgStatus');

  wrap.classList.add('show');
  status.className = 'img-status wait';
  status.textContent = 'A processar QR code...';

  const reader = new FileReader();
  reader.onload = function(e) {
    preview.src = e.target.result;
    preview.onload = function() {
      const canvas = document.getElementById('canvas');
      const ctx    = canvas.getContext('2d');

      const tamanhos = [
        { w: preview.naturalWidth,     h: preview.naturalHeight },
        { w: preview.naturalWidth * 2, h: preview.naturalHeight * 2 },
        { w: 1500, h: 1500 },
        { w: 800,  h: 800 }
      ];

      const modos = ['normal', 'aumentar_brilho', 'threshold_baixo', 'inverter'];
      let code = null;

      for (const t of tamanhos) {
        if (code) break;
        canvas.width  = t.w;
        canvas.height = t.h;
        ctx.drawImage(preview, 0, 0, t.w, t.h);

        // Sem processamento
        let imageData = ctx.getImageData(0, 0, t.w, t.h);
        code = jsQR(imageData.data, t.w, t.h, { inversionAttempts: 'attemptBoth' });
        if (code) break;

        // Com processamento
        for (const modo of modos) {
          if (code) break;
          ctx.drawImage(preview, 0, 0, t.w, t.h);
          imageData = processarImagem(ctx, t.w, t.h, modo);
          code = jsQR(imageData.data, t.w, t.h, { inversionAttempts: 'attemptBoth' });
        }
      }

      if (code) {
        status.className = 'img-status ok';
        status.textContent = '✅ QR code detectado!';
        processarQR(code.data);
      } else {
        status.className = 'img-status error';
        status.textContent = '❌ Não detectado. Tente uma foto mais nítida, com boa iluminação e sem sombras.';
      }
    };
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function processarImagem(ctx, w, h, modo) {
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;

  for (let i = 0; i < d.length; i += 4) {
    let avg = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
    if (modo === 'aumentar_brilho') avg = Math.min(255, avg * 1.5);
    const thr = modo === 'threshold_baixo' ? 180 : 128;
    let val = avg > thr ? 255 : 0;
    if (modo === 'inverter') val = 255 - val;
    d[i] = d[i+1] = d[i+2] = val;
    d[i+3] = 255;
  }
  ctx.putImageData(imageData, 0, 0);
  return ctx.getImageData(0, 0, w, h);
}

// ── PROCESSAR QR AT ──
function processarQR(texto) {
  document.getElementById('qrResultado').classList.add('show');
  document.getElementById('qrTexto').textContent = texto.substring(0, 120) + (texto.length > 120 ? '...' : '');

  const campos = {};
  texto.split('*').forEach(par => {
    const idx = par.indexOf(':');
    if (idx > 0) campos[par.substring(0, idx)] = par.substring(idx + 1);
  });

  if (campos['A']) setAutoField('fNif', campos['A']);

  if (campos['F'] && campos['F'].length === 8) {
    const d = campos['F'];
    setAutoField('fData', d.substring(0,4) + '-' + d.substring(4,6) + '-' + d.substring(6,8));
  }

  if (campos['G']) setAutoField('fNumero', campos['G']);

  if (campos['N']) setAutoField('fIva', parseFloat(campos['N']).toFixed(2));

  if (campos['O']) {
    setAutoField('fTotal', parseFloat(campos['O']).toFixed(2));
    const total = parseFloat(campos['O']) || 0;
    const iva   = parseFloat(campos['N']) || 0;
    setAutoField('fBase', (total - iva).toFixed(2));
  }

  showToast('✅ QR lido — confirme o fornecedor', 'ok');
  setTimeout(() => document.getElementById('fFornecedor').focus(), 300);
}

// ── GUARDAR ──
async function guardarFatura() {
  const data       = document.getElementById('fData').value;
  const numero     = document.getElementById('fNumero').value.trim();
  const nif        = document.getElementById('fNif').value.trim();
  const fornecedor = document.getElementById('fFornecedor').value.trim();
  const base       = parseFloat(document.getElementById('fBase').value)  || 0;
  const iva        = parseFloat(document.getElementById('fIva').value)   || 0;
  const total      = parseFloat(document.getElementById('fTotal').value) || 0;
  const notas      = document.getElementById('fNotas').value.trim();

  if (!data)       { showToast('Data obrigatória', 'error'); return; }
  if (!numero)     { showToast('Número de fatura obrigatório', 'error'); return; }
  if (!fornecedor) { showToast('Fornecedor obrigatório', 'error'); return; }
  if (!total)      { showToast('Total obrigatório', 'error'); return; }

  try {
    setLoading(true, 'A guardar...');
    const res = await apiRequest('registarFatura', {
      data, numero, nif, fornecedor,
      base:  base.toFixed(2),
      iva:   iva.toFixed(2),
      total: total.toFixed(2),
      notas
    });
    if (res && res.status === 'success') {
      showToast('✅ Fatura registada!', 'ok');
      limparForm();
    } else {
      showToast(res?.message || 'Erro ao guardar', 'error');
    }
  } catch(e) {
    showToast('Erro de ligação', 'error');
  } finally {
    setLoading(false);
  }
}

function limparForm() {
  ['fData','fNumero','fNif','fFornecedor','fBase','fIva','fTotal','fNotas'].forEach(id => {
    const el = document.getElementById(id);
    el.value = '';
    el.classList.remove('auto');
  });
  document.getElementById('qrResultado').classList.remove('show');
  document.getElementById('imgPreviewWrap').classList.remove('show');
  document.getElementById('fData').value = new Date().toISOString().split('T')[0];
}

// ── LISTA ──
async function carregarLista() {
  try {
    const mes = document.getElementById('filtroMes').value;
    const res = await apiRequest('listarFaturas', { mes: mes || '' });
    if (res && Array.isArray(res.faturas)) {
      todasFaturas = res.faturas;
      filtrarLista();
      const totalVal = todasFaturas.reduce((s, f) => s + (parseFloat(f.total) || 0), 0);
      document.getElementById('statTotal').textContent = todasFaturas.length;
      document.getElementById('statValor').textContent = totalVal.toFixed(2).replace('.', ',') + ' €';
    }
  } catch(e) {
    document.getElementById('listaFaturas').innerHTML = '<div class="empty-msg">Erro ao carregar</div>';
  }
}

function filtrarLista() {
  const texto = (document.getElementById('filtroTexto').value || '').toLowerCase();
  const filtradas = texto
    ? todasFaturas.filter(f =>
        (f.fornecedor||'').toLowerCase().includes(texto) ||
        (f.numero||'').toLowerCase().includes(texto) ||
        (f.nif||'').includes(texto))
    : todasFaturas;

  const el = document.getElementById('listaFaturas');
  if (!filtradas.length) { el.innerHTML = '<div class="empty-msg">Sem faturas</div>'; return; }

  el.innerHTML = filtradas.map(f => `
    <div class="fatura-item" onclick="abrirDetalhe('${f.id}')">
      <div class="fatura-header">
        <div class="fatura-numero">${f.numero || '—'}</div>
        <div class="fatura-total">${parseFloat(f.total||0).toFixed(2).replace('.',',')} €</div>
      </div>
      <div class="fatura-fornecedor">${f.fornecedor || '—'}${f.nif ? ' · ' + f.nif : ''}</div>
      <div class="fatura-data">${formatarData(f.data)}</div>
      ${(f.base || f.iva) ? `<div class="fatura-ivas">
        ${f.base ? `<span class="iva-badge">Base: ${parseFloat(f.base).toFixed(2)} €</span>` : ''}
        ${f.iva  ? `<span class="iva-badge">IVA: ${parseFloat(f.iva).toFixed(2)} €</span>` : ''}
      </div>` : ''}
    </div>`).join('');
}

function formatarData(iso) {
  if (!iso) return '—';
  const p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}

// ── MODAL ──
function abrirDetalhe(id) {
  const f = todasFaturas.find(f => f.id === id);
  if (!f) return;
  faturaSelId = id;
  document.getElementById('modalConteudo').innerHTML = `
    <div class="modal-row"><span class="modal-key">Data</span><span class="modal-val">${formatarData(f.data)}</span></div>
    <div class="modal-row"><span class="modal-key">Nº Fatura</span><span class="modal-val">${f.numero || '—'}</span></div>
    <div class="modal-row"><span class="modal-key">Fornecedor</span><span class="modal-val">${f.fornecedor || '—'}</span></div>
    <div class="modal-row"><span class="modal-key">NIF</span><span class="modal-val">${f.nif || '—'}</span></div>
    <div class="modal-row"><span class="modal-key">Base Tributável</span><span class="modal-val">${parseFloat(f.base||0).toFixed(2)} €</span></div>
    <div class="modal-row"><span class="modal-key">IVA</span><span class="modal-val">${parseFloat(f.iva||0).toFixed(2)} €</span></div>
    <div class="modal-row"><span class="modal-key">Total</span><span class="modal-val" style="color:var(--gold);font-weight:700">${parseFloat(f.total||0).toFixed(2)} €</span></div>
    ${f.notas ? `<div class="modal-row"><span class="modal-key">Notas</span><span class="modal-val">${f.notas}</span></div>` : ''}
    <div class="modal-row"><span class="modal-key">Registado</span><span class="modal-val">${f.dataRegisto ? new Date(f.dataRegisto).toLocaleString('pt-PT') : '—'}</span></div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function fecharModal(e) { if (e.target === document.getElementById('modalOverlay')) fecharModalDireto(); }
function fecharModalDireto() { document.getElementById('modalOverlay').classList.remove('show'); faturaSelId = null; }

async function apagarFatura() {
  if (!faturaSelId || !confirm('Apagar esta fatura?')) return;
  try {
    setLoading(true, 'A apagar...');
    const res = await apiRequest('apagarFatura', { id: faturaSelId });
    if (res && res.status === 'success') {
      showToast('Fatura apagada', 'ok');
      fecharModalDireto();
      carregarLista();
    } else {
      showToast(res?.message || 'Erro', 'error');
    }
  } catch(e) { showToast('Erro de ligação', 'error'); }
  finally { setLoading(false); }
}

// ── AUTOCOMPLETE NIF → FORNECEDOR ──
document.addEventListener('DOMContentLoaded', () => {
  const agora = new Date();
  document.getElementById('filtroMes').value = agora.getFullYear() + '-' + String(agora.getMonth()+1).padStart(2,'0');
  document.getElementById('fData').value = agora.toISOString().split('T')[0];

  document.getElementById('fNif').addEventListener('blur', async function() {
    const nif = this.value.trim();
    if (nif.length < 9) return;
    if (document.getElementById('fFornecedor').value.trim()) return;
    try {
      const res = await apiRequest('listarFaturas', { mes: '' });
      if (res && Array.isArray(res.faturas)) {
        const encontrada = res.faturas.find(f => f.nif === nif);
        if (encontrada && encontrada.fornecedor) {
          document.getElementById('fFornecedor').value = encontrada.fornecedor;
          document.getElementById('fFornecedor').classList.add('auto');
        }
      }
    } catch(e) {}
  });
});

window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>
</body>
</html>
