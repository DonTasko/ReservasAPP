<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozinha | Don Tasko</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c96a; --gold-dim: rgba(201,168,76,0.12);
  --dark: #0f0e0c; --surface: #1a1815; --surface2: #242018; --border: #2e2b22;
  --text: #f0ead6; --text-muted: #8a8070; --text-dim: #504a3e;
  --success: #2e7d52; --success-dim: rgba(46,125,82,0.15);
  --red: #c0392b; --red-dim: rgba(192,57,43,0.15);
  --amber: #d4870a; --amber-dim: rgba(212,135,10,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

#login-screen { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-wrap { width: 340px; text-align: center; }
.login-logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
.login-sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 36px; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
.login-box input { width: 100%; background: var(--dark); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 9px; font-size: 15px; font-family: inherit; margin-bottom: 12px; }
.login-box input:focus { outline: none; border-color: var(--gold); }
.login-box button { width: 100%; background: var(--gold); color: var(--dark); border: none; padding: 13px; border-radius: 9px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
.login-erro { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }

#app { display: none; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-brand { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--gold); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.topbar-status { font-size: 12px; color: var(--text-muted); }
.topbar-status.live { color: #4caf82; }
.btn-top { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; transition: all 0.2s; }
.btn-top:hover { border-color: var(--gold); color: var(--gold); }

.main { padding: 24px; max-width: 1200px; margin: 0 auto; }

.stats-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 120px; }
.stat-val { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { padding: 9px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; transition: all 0.2s; }
.tab.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

.pedidos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

.pedido-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.pedido-card.urgente { border-color: rgba(192,57,43,0.5); }
.pedido-header { background: var(--surface2); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.pedido-mesa { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--gold); }
.pedido-tempo { font-size: 12px; color: var(--text-muted); }
.pedido-tempo.urgente { color: #e74c3c; font-weight: 700; }
.pedido-body { padding: 16px; }
.pedido-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
.pedido-item:last-child { border-bottom: none; }
.pedido-qty { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
.pedido-nome { font-size: 0.95rem; font-weight: 600; color: var(--text); }
.pedido-ponto { display: inline-block; margin-top: 4px; background: var(--amber-dim); border: 1px solid rgba(212,135,10,0.3); color: var(--amber); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
.pedido-notas { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 8px; font-size: 0.82rem; color: var(--text-muted); border-left: 3px solid var(--gold); }
.pedido-footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.btn-concluir { flex: 1; background: var(--success); color: white; border: none; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.2s; }
.btn-concluir:hover { opacity: 0.85; }
.btn-cancelar { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 11px 14px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.2s; }
.btn-cancelar:hover { border-color: var(--red); color: #e74c3c; }

.empty-cozinha { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
.empty-cozinha .icon { font-size: 3rem; margin-bottom: 12px; }

.badge-novo { background: #e74c3c; color: white; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

@media (max-width: 600px) { .main { padding: 16px; } .pedidos-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">DON TASKO</div>
    <div class="login-sub">Painel de Cozinha</div>
    <div class="login-box">
      <input type="password" id="passInput" placeholder="Palavra-passe" autocomplete="current-password">
      <button onclick="verificarPass()">Entrar</button>
      <div class="login-erro" id="loginErro">⚠️ Palavra-passe incorreta</div>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">🍳 COZINHA</div>
    <div class="topbar-right">
      <span class="topbar-status" id="topbarStatus">A actualizar...</span>
      <button class="btn-top" onclick="carregarPedidos()">🔄 Actualizar</button>
      <a href="admin.html"><button class="btn-top">← Admin</button></a>
      <button class="btn-top" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="stats-bar">
      <div class="stat"><div class="stat-val" id="statPendentes">0</div><div class="stat-lbl">Pendentes</div></div>
      <div class="stat"><div class="stat-val" id="statEmCurso">0</div><div class="stat-lbl">Em curso</div></div>
      <div class="stat"><div class="stat-val" id="statConcluidos">0</div><div class="stat-lbl">Concluídos hoje</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="setTab('pendente', this)">⏳ Pendentes</button>
      <button class="tab" onclick="setTab('em_curso', this)">🔥 Em curso</button>
      <button class="tab" onclick="setTab('concluido', this)">✅ Concluídos</button>
    </div>

    <div class="pedidos-grid" id="pedidosGrid">
      <div class="empty-cozinha"><div class="icon">🍽️</div>A carregar...</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const PASS = 'Tasko123';
let pedidos = [];
let tabActiva = 'pendente';
let intervalId = null;

function verificarPass() {
  if (document.getElementById('passInput').value === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    iniciar();
  } else {
    const el = document.getElementById('loginErro');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }
}
document.getElementById('passInput').addEventListener('keypress', e => { if (e.key === 'Enter') verificarPass(); });
function logout() { clearInterval(intervalId); document.getElementById('app').style.display = 'none'; document.getElementById('login-screen').style.display = 'flex'; }

function setTab(tab, btn) {
  tabActiva = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPedidos();
}

function minutosDesde(dataHoraStr) {
  try {
    const d = new Date(dataHoraStr);
    return Math.floor((Date.now() - d.getTime()) / 60000);
  } catch(e) { return 0; }
}

async function carregarPedidos() {
  try {
    const res = await apiRequest('getPedidos');
    if (res && Array.isArray(res.pedidos)) {
      pedidos = res.pedidos;
      actualizarStats();
      renderPedidos();
      const agora = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const statusEl = document.getElementById('topbarStatus');
      statusEl.textContent = 'Actualizado às ' + agora;
      statusEl.className = 'topbar-status live';
    }
  } catch(e) {
    document.getElementById('topbarStatus').textContent = 'Erro de ligação';
    document.getElementById('topbarStatus').className = 'topbar-status';
  }
}

function actualizarStats() {
  const pendentes  = pedidos.filter(p => p.status === 'pendente').length;
  const emCurso    = pedidos.filter(p => p.status === 'em_curso').length;
  const concluidos = pedidos.filter(p => p.status === 'concluido').length;
  document.getElementById('statPendentes').textContent = pendentes;
  document.getElementById('statEmCurso').textContent   = emCurso;
  document.getElementById('statConcluidos').textContent = concluidos;
}

function renderPedidos() {
  const grid = document.getElementById('pedidosGrid');
  const filtrados = pedidos.filter(p => p.status === tabActiva);

  if (!filtrados.length) {
    const msgs = { pendente: 'Sem pedidos pendentes', em_curso: 'Nenhum pedido em curso', concluido: 'Sem pedidos concluídos hoje' };
    grid.innerHTML = `<div class="empty-cozinha"><div class="icon">✨</div>${msgs[tabActiva] || 'Sem pedidos'}</div>`;
    return;
  }

  grid.innerHTML = filtrados.map(p => {
    const mins = minutosDesde(p.dataHora);
    const urgente = mins > 15 && p.status === 'pendente';
    const tempoTxt = mins < 1 ? 'Agora' : mins + ' min atrás';
    let itensHtml = '';
    try {
      const itens = Array.isArray(p.itens) ? p.itens : JSON.parse(p.itens || '[]');
      itensHtml = itens.map(i => `
        <div class="pedido-item">
          <div class="pedido-qty">${i.qty || 1}×</div>
          <div>
            <div class="pedido-nome">${i.nome || ''}</div>
            ${i.ponto ? `<span class="pedido-ponto">🥩 ${i.ponto}</span>` : ''}
          </div>
        </div>`).join('');
    } catch(e) { itensHtml = '<div class="pedido-item">Erro ao ler itens</div>'; }

    const acoes = p.status === 'pendente'
      ? `<button class="btn-concluir" onclick="mudarStatus('${p.id}', 'em_curso')">🔥 Iniciar</button>
         <button class="btn-cancelar" onclick="mudarStatus('${p.id}', 'cancelado')">✕</button>`
      : p.status === 'em_curso'
      ? `<button class="btn-concluir" onclick="mudarStatus('${p.id}', 'concluido')">✅ Concluído</button>
         <button class="btn-cancelar" onclick="mudarStatus('${p.id}', 'cancelado')">✕</button>`
      : `<button class="btn-concluir" style="background:var(--text-dim);cursor:default">✅ Concluído</button>`;

    return `<div class="pedido-card${urgente ? ' urgente' : ''}">
      <div class="pedido-header">
        <div>
          <div class="pedido-mesa">Mesa ${p.mesa}</div>
          <div class="pedido-tempo${urgente ? ' urgente' : ''}">${tempoTxt}${urgente ? ' ⚠️' : ''}</div>
        </div>
        ${p.status === 'pendente' && mins < 3 ? '<span class="badge-novo">NOVO</span>' : ''}
      </div>
      <div class="pedido-body">
        ${itensHtml}
        ${p.notas ? `<div class="pedido-notas">📝 ${p.notas}</div>` : ''}
      </div>
      <div class="pedido-footer">${acoes}</div>
    </div>`;
  }).join('');
}

async function mudarStatus(id, novoStatus) {
  try {
    const res = await apiRequest('atualizarStatusPedido', { id, status: novoStatus });
    if (res && res.status === 'success') {
      await carregarPedidos();
    }
  } catch(e) { console.error(e); }
}

function iniciar() {
  carregarPedidos();
  intervalId = setInterval(carregarPedidos, 30000);
}
</script>
</body>
</html>
