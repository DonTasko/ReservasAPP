<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozinha | Don Tasko</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c96a; --gold-dim: rgba(201,168,76,0.12);
  --dark: #0f0e0c; --surface: #1a1815; --surface2: #242018; --border: #2e2b22;
  --text: #f0ead6; --text-muted: #8a8070; --text-dim: #504a3e;
  --success: #2e7d52; --success-dim: rgba(46,125,82,0.15);
  --red: #c0392b; --red-dim: rgba(192,57,43,0.15);
  --amber: #d4870a; --amber-dim: rgba(212,135,10,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

#login-screen { position: fixed; inset: 0; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
.login-wrap { width: 340px; text-align: center; }
.login-logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; margin-bottom: 6px; }
.login-sub { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 36px; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
.login-box input { width: 100%; background: var(--dark); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 9px; font-size: 15px; font-family: inherit; margin-bottom: 12px; }
.login-box input:focus { outline: none; border-color: var(--gold); }
.login-box button { width: 100%; background: var(--gold); color: var(--dark); border: none; padding: 13px; border-radius: 9px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
.login-erro { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }

#app { display: none; }

.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-brand { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 900; color: var(--gold); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-status { font-size: 12px; color: var(--text-muted); }
.topbar-status.live { color: #4caf82; }
.btn-top { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-top:hover { border-color: var(--gold); color: var(--gold); }

.stats-bar { display: flex; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--dark); }
.stat-val { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; line-height: 1; }
.stat-lbl { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); }
.stat.pendentes .stat-val { color: #e74c3c; }
.stat.em-curso  .stat-val { color: var(--amber); }
.stat.concluidos .stat-val { color: #4caf82; }

.main { padding: 20px 24px; }

.colunas-activas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

.coluna-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
.coluna-titulo { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; }
.coluna-count { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.col-novos .coluna-titulo { color: #e74c3c; }
.col-novos .coluna-header { border-bottom-color: rgba(192,57,43,0.4); }
.col-curso .coluna-titulo { color: var(--amber); }
.col-curso .coluna-header { border-bottom-color: rgba(212,135,10,0.4); }

.pedidos-lista { display: flex; flex-direction: column; gap: 12px; }

.pedido-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.pedido-card.novo   { border-left: 3px solid #e74c3c; }
.pedido-card.curso  { border-left: 3px solid var(--amber); }
.pedido-card.urgente { border-left: 3px solid #e74c3c; animation: blink 1.5s infinite; }
.pedido-card.concluido { border-left: 3px solid #4caf82; opacity: 0.65; }
.pedido-card.concluido:hover { opacity: 1; }
@keyframes blink { 0%,100% { border-left-color: #e74c3c; } 50% { border-left-color: rgba(192,57,43,0.2); } }

.pedido-header { background: var(--surface2); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.pedido-mesa-wrap { display: flex; align-items: baseline; gap: 8px; }
.pedido-mesa { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); line-height: 1; }
.pedido-hora { font-size: 11px; color: var(--text-muted); }
.pedido-tempo { font-size: 12px; font-weight: 600; }
.pedido-tempo.normal  { color: var(--text-muted); }
.pedido-tempo.alerta  { color: var(--amber); }
.pedido-tempo.urgente { color: #e74c3c; }
.badge-novo { background: #e74c3c; color: white; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; letter-spacing: 0.5px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

/* PROGRESSO */
.pedido-progresso { padding: 6px 14px; background: var(--dark); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; background: var(--success); transition: width 0.4s ease; }
.progress-text { font-size: 11px; color: var(--text-muted); white-space: nowrap; font-weight: 600; }

/* ITENS COM CHECKBOX */
.pedido-body { padding: 8px 14px; }

.pedido-item { padding: 9px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: opacity 0.2s; user-select: none; }
.pedido-item:last-child { border-bottom: none; }
.pedido-item.pronto { opacity: 0.45; }

.item-check {
  width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; background: var(--dark); cursor: pointer;
}
.item-check.checked { background: var(--success); border-color: var(--success); }
.item-check.checked::after { content: '✓'; color: white; font-size: 13px; font-weight: 700; }

.pedido-qty { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); min-width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; flex-shrink: 0; padding: 0 4px; }
.pedido-nome { font-size: 0.9rem; font-weight: 600; color: var(--text); }
.pedido-ponto { display: inline-block; margin-top: 3px; background: var(--amber-dim); border: 1px solid rgba(212,135,10,0.3); color: var(--amber); padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; font-weight: 600; }
.pedido-item.pronto .pedido-nome { text-decoration: line-through; color: var(--text-dim); }

.pedido-notas { margin: 4px 0 6px; padding: 7px 10px; background: var(--surface2); border-radius: 7px; font-size: 0.8rem; color: var(--text-muted); border-left: 2px solid var(--gold); }

.pedido-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.btn-iniciar  { flex: 1; background: var(--amber);   color: white; border: none; padding: 10px; border-radius: 7px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.btn-iniciar:hover  { opacity: 0.85; }
.btn-concluir { flex: 1; background: var(--success);  color: white; border: none; padding: 10px; border-radius: 7px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
.btn-concluir:hover { opacity: 0.85; }
.btn-cancelar { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px 12px; border-radius: 7px; font-size: 12px; font-family: inherit; cursor: pointer; }
.btn-cancelar:hover { border-color: var(--red); color: #e74c3c; }

.divider-concluidos { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.divider-concluidos span { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #4caf82; font-weight: 700; white-space: nowrap; }
.divider-concluidos::before, .divider-concluidos::after { content: ''; flex: 1; height: 1px; background: rgba(46,125,82,0.3); }
.concluidos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }

.empty-col { text-align: center; padding: 28px 16px; color: var(--text-dim); font-size: 13px; border: 1px dashed var(--border); border-radius: 10px; }

@media (max-width: 700px) {
  .colunas-activas { grid-template-columns: 1fr; }
  .concluidos-grid { grid-template-columns: 1fr; }
  .main { padding: 14px; }
  .stats-bar { padding: 12px 14px; }
  .topbar { padding: 0 14px; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo">DON TASKO</div>
    <div class="login-sub">Painel de Cozinha</div>
    <div class="login-box">
      <input type="password" id="passInput" placeholder="Palavra-passe" autocomplete="current-password">
      <button onclick="verificarPass()">Entrar</button>
      <div class="login-erro" id="loginErro">⚠️ Palavra-passe incorreta</div>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">🍳 COZINHA</div>
    <div class="topbar-right">
      <span class="topbar-status" id="topbarStatus">A carregar...</span>
      <button class="btn-top" onclick="carregarPedidos()">🔄</button>
      <a href="admin.html" class="btn-top">← Admin</a>
      <button class="btn-top" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat pendentes"><div class="stat-val" id="statPendentes">0</div><div class="stat-lbl">Novos</div></div>
    <div class="stat em-curso"><div class="stat-val" id="statEmCurso">0</div><div class="stat-lbl">Em curso</div></div>
    <div class="stat concluidos"><div class="stat-val" id="statConcluidos">0</div><div class="stat-lbl">Concluídos hoje</div></div>
    <div style="margin-left:auto;font-size:12px;color:var(--text-dim);align-self:center">Actualiza a cada 30s</div>
  </div>

  <div class="main">
    <div class="colunas-activas">
      <div class="col-novos">
        <div class="coluna-header">
          <span class="coluna-titulo">🔴 Novos Pedidos</span>
          <span class="coluna-count" id="countNovos">0</span>
        </div>
        <div class="pedidos-lista" id="listaNovos"><div class="empty-col">Sem pedidos novos ✨</div></div>
      </div>
      <div class="col-curso">
        <div class="coluna-header">
          <span class="coluna-titulo">🔥 Em Curso</span>
          <span class="coluna-count" id="countCurso">0</span>
        </div>
        <div class="pedidos-lista" id="listaCurso"><div class="empty-col">Nada em preparação</div></div>
      </div>
    </div>

    <div id="secaoConcluidos" style="display:none">
      <div class="divider-concluidos"><span>✅ Concluídos Hoje</span></div>
      <div class="concluidos-grid" id="listaConcluidos"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const PASS = 'Tasko123';
let pedidos = [];
let intervalId = null;
// Estado local dos itens picados: { pedidoId: Set(itemIdx) }
let itensProntos = {};

function verificarPass() {
  if (document.getElementById('passInput').value === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    iniciar();
  } else {
    const el = document.getElementById('loginErro');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }
}
document.getElementById('passInput').addEventListener('keypress', e => { if (e.key === 'Enter') verificarPass(); });

function logout() {
  clearInterval(intervalId);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('passInput').value = '';
}

function minutosDesde(str) {
  try { return Math.floor((Date.now() - new Date(str).getTime()) / 60000); }
  catch(e) { return 0; }
}

function horaFmt(str) {
  try { return new Date(str).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }); }
  catch(e) { return ''; }
}

function tempoHTML(mins) {
  if (mins < 1) return `<span class="pedido-tempo normal">Agora</span>`;
  if (mins > 20) return `<span class="pedido-tempo urgente">${mins} min ⚠️</span>`;
  if (mins > 10) return `<span class="pedido-tempo alerta">${mins} min</span>`;
  return `<span class="pedido-tempo normal">${mins} min</span>`;
}

// ── PICAR ITEM ──
function picarItem(pedidoId, itemIdx, totalItens) {
  if (!itensProntos[pedidoId]) itensProntos[pedidoId] = new Set();
  const set = itensProntos[pedidoId];

  if (set.has(itemIdx)) {
    set.delete(itemIdx);
  } else {
    set.add(itemIdx);
  }

  // Actualizar visualmente sem re-render completo
  const checkEl = document.getElementById(`check_${pedidoId}_${itemIdx}`);
  const itemEl  = document.getElementById(`item_${pedidoId}_${itemIdx}`);
  if (checkEl) checkEl.classList.toggle('checked', set.has(itemIdx));
  if (itemEl)  itemEl.classList.toggle('pronto', set.has(itemIdx));

  // Actualizar barra de progresso
  const prontos = set.size;
  const pct = Math.round((prontos / totalItens) * 100);
  const fillEl = document.getElementById(`prog_${pedidoId}`);
  const textEl = document.getElementById(`progt_${pedidoId}`);
  if (fillEl) fillEl.style.width = pct + '%';
  if (textEl) textEl.textContent = prontos + '/' + totalItens;

  // Se todos prontos → concluir automaticamente
  if (prontos >= totalItens) {
    setTimeout(() => mudarStatus(pedidoId, 'concluido'), 600);
  }
}

// ── BUILD CARD ──
function buildCard(p, tipo) {
  const mins = minutosDesde(p.dataHora);
  const urgente = mins > 20 && tipo === 'novo';

  let itens = [];
  try { itens = Array.isArray(p.itens) ? p.itens : JSON.parse(p.itens || '[]'); } catch(e) {}

  // Expandir itens por quantidade (cada unidade = linha separada)
  const linhas = [];
  itens.forEach(i => {
    const qty = parseInt(i.qty) || 1;
    for (let n = 0; n < qty; n++) {
      linhas.push({ nome: i.nome || '', ponto: i.ponto || '', _orig: i });
    }
  });

  const totalLinhas = linhas.length;
  const prontos = itensProntos[p.id] ? itensProntos[p.id].size : 0;
  const pct = totalLinhas > 0 ? Math.round((prontos / totalLinhas) * 100) : 0;

  // HTML dos itens com checkbox
  const itensHtml = linhas.map((linha, idx) => {
    const estaPronto = itensProntos[p.id] && itensProntos[p.id].has(idx);
    return `<div class="pedido-item${estaPronto ? ' pronto' : ''}" id="item_${p.id}_${idx}"
              onclick="picarItem('${p.id}', ${idx}, ${totalLinhas})">
      <div class="item-check${estaPronto ? ' checked' : ''}" id="check_${p.id}_${idx}"></div>
      <div class="pedido-qty">1×</div>
      <div>
        <div class="pedido-nome">${linha.nome}</div>
        ${i.ponto ? `<span class="pedido-ponto">🥩 ${i.ponto}</span>` : ''}
${i.peso  ? `<span class="pedido-ponto" style="background:var(--blue-dim);border-color:rgba(41,128,185,0.3);color:#3498db">⚖️ ${i.peso}</span>` : ''}
      </div>
    </div>`;
  }).join('');

  // Barra de progresso (só em curso)
  const progressoHtml = tipo === 'curso' ? `
    <div class="pedido-progresso">
      <div class="progress-bar"><div class="progress-fill" id="prog_${p.id}" style="width:${pct}%"></div></div>
      <span class="progress-text" id="progt_${p.id}">${prontos}/${totalLinhas}</span>
    </div>` : '';

  // Acções
  let acoes = '';
  if (tipo === 'novo') {
    acoes = `<button class="btn-iniciar" onclick="mudarStatus('${p.id}','em_curso')">🔥 Iniciar</button>
             <button class="btn-cancelar" onclick="mudarStatus('${p.id}','cancelado')">✕</button>`;
  } else if (tipo === 'curso') {
    acoes = `<button class="btn-concluir" onclick="mudarStatus('${p.id}','concluido')">✅ Concluído</button>
             <button class="btn-cancelar" onclick="mudarStatus('${p.id}','cancelado')">✕</button>`;
  } else {
    acoes = `<button class="btn-concluir" style="background:var(--text-dim);cursor:default;flex:1">✅ Pronto</button>`;
  }

  const classeCard = urgente ? 'urgente' : tipo === 'novo' ? 'novo' : tipo === 'curso' ? 'curso' : 'concluido';

  return `<div class="pedido-card ${classeCard}">
    <div class="pedido-header">
      <div class="pedido-mesa-wrap">
        <div class="pedido-mesa">Mesa ${p.mesa}</div>
        <div class="pedido-hora">${horaFmt(p.dataHora)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${tipo === 'novo' && mins < 3 ? '<span class="badge-novo">NOVO</span>' : ''}
        ${tipo !== 'concluido' ? tempoHTML(mins) : ''}
      </div>
    </div>
    ${progressoHtml}
    <div class="pedido-body">
      ${itensHtml}
      ${p.notas ? `<div class="pedido-notas">📝 ${p.notas}</div>` : ''}
    </div>
    <div class="pedido-footer">${acoes}</div>
  </div>`;
}

async function carregarPedidos() {
  try {
    const res = await apiRequest('getPedidos');
    if (res && Array.isArray(res.pedidos)) {
      pedidos = res.pedidos;
      renderPedidos();
      const agora = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const el = document.getElementById('topbarStatus');
      el.textContent = 'Actualizado às ' + agora;
      el.className = 'topbar-status live';
    }
  } catch(e) {
    document.getElementById('topbarStatus').textContent = 'Erro de ligação';
    document.getElementById('topbarStatus').className = 'topbar-status';
  }
}

function renderPedidos() {
  const novos      = pedidos.filter(p => p.status === 'pendente');
  const emCurso    = pedidos.filter(p => p.status === 'em_curso');
  const concluidos = pedidos.filter(p => p.status === 'concluido');

  document.getElementById('statPendentes').textContent  = novos.length;
  document.getElementById('statEmCurso').textContent    = emCurso.length;
  document.getElementById('statConcluidos').textContent = concluidos.length;
  document.getElementById('countNovos').textContent     = novos.length;
  document.getElementById('countCurso').textContent     = emCurso.length;

  document.getElementById('listaNovos').innerHTML = novos.length
    ? novos.map(p => buildCard(p, 'novo')).join('')
    : '<div class="empty-col">Sem pedidos novos ✨</div>';

  document.getElementById('listaCurso').innerHTML = emCurso.length
    ? emCurso.map(p => buildCard(p, 'curso')).join('')
    : '<div class="empty-col">Nada em preparação</div>';

  const secao = document.getElementById('secaoConcluidos');
  if (concluidos.length) {
    secao.style.display = 'block';
    document.getElementById('listaConcluidos').innerHTML = [...concluidos].reverse().map(p => buildCard(p, 'concluido')).join('');
  } else {
    secao.style.display = 'none';
  }
}

async function mudarStatus(id, novoStatus) {
  // Limpar estado local se concluído ou cancelado
  if (novoStatus === 'concluido' || novoStatus === 'cancelado') {
    delete itensProntos[id];
  }
  try {
    const res = await apiRequest('atualizarStatusPedido', { id, status: novoStatus });
    if (res && res.status === 'success') await carregarPedidos();
  } catch(e) { console.error(e); }
}

function iniciar() {
  carregarPedidos();
  intervalId = setInterval(carregarPedidos, 30000);
}
</script>
</body>
</html>
