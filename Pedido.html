<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu | Don Tasko</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c96a; --gold-dim: rgba(201,168,76,0.12);
  --dark: #0f0e0c; --surface: #1a1815; --surface2: #242018; --border: #2e2b22;
  --text: #f0ead6; --text-muted: #8a8070; --text-dim: #504a3e;
  --success: #2e7d52; --success-dim: rgba(46,125,82,0.15);
  --red: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; padding-bottom: 120px; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header-brand { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
.header-mesa { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }

.main { max-width: 600px; margin: 0 auto; padding: 20px 16px; }

.section-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

.prato { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; transition: border-color 0.2s; }
.prato.selected { border-color: var(--gold); background: var(--gold-dim); }
.prato-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.prato-check { width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: var(--dark); transition: all 0.15s; }
.prato.selected .prato-check { background: var(--gold); border-color: var(--gold); }
.prato.selected .prato-check::after { content: '✓'; display: block; font-weight: 700; }
.prato-check::after { content: ''; }
.prato-info { flex: 1; }
.prato-nome { font-size: 0.95rem; font-weight: 600; color: var(--text); }
.prato-preco { font-size: 0.85rem; color: var(--gold); font-weight: 600; margin-top: 2px; }

.ponto-selector { margin-top: 10px; display: none; }
.prato.selected .ponto-selector { display: block; }
.ponto-label { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.ponto-options { display: flex; gap: 6px; flex-wrap: wrap; }
.ponto-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
.ponto-btn:hover { border-color: var(--gold); color: var(--gold); }
.ponto-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); }

.qty-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.qty-label { font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.qty-btn:hover { border-color: var(--gold); color: var(--gold); }
.qty-val { font-size: 1rem; font-weight: 700; min-width: 20px; text-align: center; }

.notas-field { margin-top: 20px; }
.notas-field label { display: block; font-size: 0.7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.notas-field textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 0.9rem; font-family: 'DM Sans', sans-serif; resize: none; height: 80px; }
.notas-field textarea:focus { outline: none; border-color: var(--gold); }
.notas-field textarea::placeholder { color: var(--text-dim); }

/* CARRINHO FIXO */
.cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 16px 20px; z-index: 100; }
.cart-bar-inner { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.cart-info { flex: 1; }
.cart-count { font-size: 0.78rem; color: var(--text-muted); }
.cart-total { font-size: 1.1rem; font-weight: 700; color: var(--gold); }
.btn-pedido { background: var(--gold); color: var(--dark); border: none; padding: 14px 24px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
.btn-pedido:hover { background: var(--gold-light); }
.btn-pedido:disabled { opacity: 0.4; cursor: not-allowed; }

/* SUCCESS */
.success-screen { display: none; position: fixed; inset: 0; background: var(--dark); z-index: 200; align-items: center; justify-content: center; text-align: center; padding: 40px; }
.success-screen.show { display: flex; flex-direction: column; gap: 16px; }
.success-icon { font-size: 4rem; }
.success-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); }
.success-msg { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; max-width: 320px; }
.success-mesa { background: var(--gold-dim); border: 1px solid rgba(201,168,76,0.3); color: var(--gold); padding: 10px 20px; border-radius: 20px; font-size: 1rem; font-weight: 700; }

/* LOADING */
#loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; justify-content: center; align-items: center; }
#loading.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; font-size: 0.85rem; font-weight: 600; z-index: 400; opacity: 0; transition: all 0.3s; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { border-color: var(--red); color: #e74c3c; }
.toast.ok { border-color: var(--success); color: #4caf82; }

.empty-msg { text-align: center; padding: 40px; color: var(--text-muted); }
</style>
<script src="config.js"></script>
</head>
<body>

<div class="header">
  <div class="header-brand">DON TASKO</div>
  <div class="header-mesa" id="headerMesa">Mesa —</div>
</div>

<div class="main" id="menuContainer">
  <div class="empty-msg">A carregar menu...</div>
</div>

<div class="notas-field" style="max-width:600px;margin:0 auto;padding:0 16px 16px;">
  <label>Observações / Alergias</label>
  <textarea id="notasGerais" placeholder="Alergias, pedidos especiais..."></textarea>
</div>

<div class="cart-bar">
  <div class="cart-bar-inner">
    <div class="cart-info">
      <div class="cart-count" id="cartCount">0 itens</div>
      <div class="cart-total" id="cartTotal">0,00 €</div>
    </div>
    <button class="btn-pedido" id="btnPedido" onclick="submeterPedido()" disabled>Enviar Pedido</button>
  </div>
</div>

<div class="success-screen" id="successScreen">
  <div class="success-icon">✅</div>
  <div class="success-title">Pedido Enviado!</div>
  <div class="success-mesa" id="successMesa">Mesa —</div>
  <div class="success-msg">O seu pedido foi recebido pela cozinha. Em breve será servido.</div>
</div>

<div id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const PONTOS = ['Mal passado', 'Médio mal', 'Médio', 'Médio bem', 'Bem passado'];
let mesa = '';
let cardapio = [];
let seleccionados = {}; // { pratoId: { prato, qty, ponto } }

// ── MESA DO URL ──
function getMesa() {
  const params = new URLSearchParams(window.location.search);
  return params.get('mesa') || params.get('table') || '';
}

// ── TOAST ──
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'ok') + ' show';
  setTimeout(() => t.classList.remove('show'), 3500);
}

function setLoading(on) {
  document.getElementById('loading').classList.toggle('show', on);
}

// ── CARREGAR CARDÁPIO ──
async function carregarMenu() {
  try {
    const itens = await apiRequest('getCardapio');
    if (!Array.isArray(itens)) throw new Error('Erro ao carregar');
    cardapio = itens.filter(i => i.Nome || i.nome);
    renderMenu();
  } catch(e) {
    document.getElementById('menuContainer').innerHTML = '<div class="empty-msg">Erro ao carregar menu. Refresque a página.</div>';
  }
}

// ── RENDER MENU ──
function renderMenu() {
  const container = document.getElementById('menuContainer');
  const categorias = {};
  cardapio.forEach((item, idx) => {
    const cat = item.Categoria || item.categoria || 'Menu';
    if (!categorias[cat]) categorias[cat] = [];
    categorias[cat].push({ ...item, _idx: idx });
  });

  let html = '';
  Object.keys(categorias).forEach(cat => {
    html += `<div class="section-title">${cat}</div>`;
    categorias[cat].forEach(item => {
      const id = 'prato_' + item._idx;
      const nome = item.Nome || item.nome || '';
      const preco = parseFloat(item['Preço'] || item.preco || 0);
      const temPonto = (item.PontoCarne || item.ponto_carne || '').toString().toUpperCase() === 'SIM';
      html += `
        <div class="prato" id="${id}" onclick="togglePrato('${id}', ${item._idx})">
          <div class="prato-row">
            <div class="prato-check"></div>
            <div class="prato-info">
              <div class="prato-nome">${nome}</div>
              <div class="prato-preco">${preco.toFixed(2)} €</div>
            </div>
          </div>
          ${temPonto ? `
          <div class="ponto-selector">
            <div class="ponto-label">Ponto da carne</div>
            <div class="ponto-options" id="pontos_${id}">
              ${PONTOS.map(p => `<button class="ponto-btn" onclick="setPonto(event, '${id}', '${p}')">${p}</button>`).join('')}
            </div>
          </div>` : ''}
          <div class="qty-row">
            <span class="qty-label">Quantidade</span>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(event, '${id}', -1)">−</button>
              <span class="qty-val" id="qty_${id}">1</span>
              <button class="qty-btn" onclick="changeQty(event, '${id}', 1)">+</button>
            </div>
          </div>
        </div>`;
    });
  });

  container.innerHTML = html || '<div class="empty-msg">Menu não disponível</div>';
}

// ── TOGGLE PRATO ──
function togglePrato(id, idx) {
  const el = document.getElementById(id);
  const item = cardapio[idx];
  if (seleccionados[id]) {
    delete seleccionados[id];
    el.classList.remove('selected');
  } else {
    const preco = parseFloat(item['Preço'] || item.preco || 0);
    seleccionados[id] = { prato: item, qty: 1, ponto: '', preco };
    el.classList.add('selected');
  }
  actualizarCarrinho();
}

// ── PONTO DA CARNE ──
function setPonto(event, id, ponto) {
  event.stopPropagation();
  if (seleccionados[id]) seleccionados[id].ponto = ponto;
  document.querySelectorAll(`#pontos_${id} .ponto-btn`).forEach(btn => {
    btn.classList.toggle('active', btn.textContent === ponto);
  });
}

// ── QUANTIDADE ──
function changeQty(event, id, delta) {
  event.stopPropagation();
  if (!seleccionados[id]) return;
  const novaQty = Math.max(1, (seleccionados[id].qty || 1) + delta);
  seleccionados[id].qty = novaQty;
  document.getElementById('qty_' + id).textContent = novaQty;
  actualizarCarrinho();
}

// ── CARRINHO ──
function actualizarCarrinho() {
  const itens = Object.values(seleccionados);
  const total = itens.reduce((s, i) => s + (i.preco * i.qty), 0);
  const count = itens.reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = count + (count === 1 ? ' item' : ' itens');
  document.getElementById('cartTotal').textContent = total.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('btnPedido').disabled = count === 0;
}

// ── SUBMETER PEDIDO ──
async function submeterPedido() {
  const itens = Object.values(seleccionados);
  if (!itens.length) { showToast('Seleccione pelo menos um prato.', 'error'); return; }

  // Verificar pontos da carne em falta
  for (const item of itens) {
    const temPonto = (item.prato.PontoCarne || item.prato.ponto_carne || '').toString().toUpperCase() === 'SIM';
    if (temPonto && !item.ponto) {
      showToast('Indique o ponto da carne para: ' + (item.prato.Nome || item.prato.nome), 'error');
      return;
    }
  }

  const itensPedido = itens.map(i => ({
    nome:  i.prato.Nome || i.prato.nome,
    preco: i.preco,
    qty:   i.qty,
    ponto: i.ponto || ''
  }));

  const notas = document.getElementById('notasGerais').value.trim();

  try {
    setLoading(true);
    const res = await apiRequest('submeterPedido', {
      mesa:  mesa,
      itens: encodeURIComponent(JSON.stringify(itensPedido)),
      notas: notas
    });

    if (res && res.status === 'success') {
      document.getElementById('successMesa').textContent = 'Mesa ' + mesa;
      document.getElementById('successScreen').classList.add('show');
    } else {
      showToast(res && res.message ? res.message : 'Erro ao enviar pedido.', 'error');
    }
  } catch(e) {
    showToast('Erro de ligação. Tente novamente.', 'error');
  } finally {
    setLoading(false);
  }
}

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  mesa = getMesa();
  if (!mesa) {
    document.getElementById('headerMesa').textContent = 'Sem mesa';
    document.getElementById('menuContainer').innerHTML = '<div class="empty-msg">QR code inválido.<br>Por favor chame um colaborador.</div>';
    return;
  }
  document.getElementById('headerMesa').textContent = 'Mesa ' + mesa;
  carregarMenu();
});
</script>
</body>
</html>
