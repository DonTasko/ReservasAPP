<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário Faturas | Don Tasko</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c; --gold-light: #e8c96a; --gold-dim: rgba(201,168,76,0.12);
  --dark: #0f0e0c; --surface: #1a1815; --surface2: #242018; --border: #2e2b22;
  --text: #f0ead6; --text-muted: #8a8070; --text-dim: #504a3e;
  --success: #2e7d52; --success-dim: rgba(46,125,82,0.15);
  --green: #27ae60; --green-dim: rgba(39,174,96,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.header-brand { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 900; color: var(--gold); }
.header-right { display: flex; gap: 8px; }
.btn-top { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
.btn-top:hover { border-color: var(--gold); color: var(--gold); }

.main { max-width: 780px; margin: 0 auto; padding: 20px 16px 40px; }

.mes-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; }
.mes-titulo { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); text-align: center; flex: 1; }
.btn-nav { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.btn-nav:hover { border-color: var(--gold); color: var(--gold); }

/* LEGENDA */
.legenda { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; }
.leg-dot.faturas { background: #4caf82; }
.leg-dot.vendas  { background: var(--green); }

/* STATS */
.stats-mes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat-val { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-val.green { color: var(--green); }
.stat-lbl { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }

/* CALENDÁRIO */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-header { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); padding: 6px 0; text-transform: uppercase; }

.cal-dia { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px; min-height: 72px; cursor: pointer; transition: all 0.2s; }
.cal-dia:hover { border-color: var(--gold); }
.cal-dia.vazio { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
.cal-dia.hoje { border-color: rgba(201,168,76,0.5); }
.cal-dia.tem-dados { border-color: rgba(39,174,96,0.3); }
.cal-dia.tem-dados:hover { border-color: var(--green); }
.cal-dia-num { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
.cal-dia.hoje .cal-dia-num { color: var(--gold); font-weight: 700; }
.cal-dia.tem-dados .cal-dia-num { color: var(--text); }

/* LINHA FATURAS */
.cal-fat { display: flex; align-items: center; gap: 3px; margin-bottom: 2px; }
.cal-fat-dot { width: 5px; height: 5px; border-radius: 50%; background: #4caf82; flex-shrink: 0; }
.cal-fat-info { font-size: 9px; color: #4caf82; line-height: 1.2; }

/* LINHA VENDAS */
.cal-venda { display: flex; align-items: center; gap: 3px; }
.cal-venda-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.cal-venda-info { font-size: 9px; color: #2ecc71; line-height: 1.2; }

/* MODAL DIA */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 24px 20px 32px; width: 100%; max-width: 700px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--gold); margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

.modal-section { margin-bottom: 16px; }
.modal-section-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.modal-section-title.faturas { color: #4caf82; }
.modal-section-title.vendas  { color: var(--green); }

.fatura-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; }
.fatura-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.fatura-numero { font-size: 13px; font-weight: 700; }
.fatura-total { font-size: 13px; font-weight: 700; color: var(--gold); }
.fatura-fornecedor { font-size: 12px; color: var(--text-muted); }
.fatura-detalhes { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

.venda-card { background: rgba(39,174,96,0.08); border: 1px solid rgba(39,174,96,0.3); border-radius: 9px; padding: 14px; }
.venda-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(39,174,96,0.15); font-size: 13px; }
.venda-row:last-child { border-bottom: none; font-weight: 700; }
.venda-key { color: var(--text-muted); }
.venda-val { font-weight: 600; color: #2ecc71; }
.venda-val.gold { color: var(--gold); }

.modal-totais { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.modal-total-card { padding: 10px 14px; border-radius: 8px; text-align: center; }
.modal-total-card.fat { background: rgba(76,175,130,0.1); border: 1px solid rgba(76,175,130,0.3); }
.modal-total-card.venda { background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.3); }
.modal-total-val { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; }
.modal-total-card.fat .modal-total-val { color: #4caf82; }
.modal-total-card.venda .modal-total-val { color: #2ecc71; }
.modal-total-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.btn-fechar { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 12px; border-radius: 9px; font-size: 13px; cursor: pointer; font-family: inherit; margin-top: 14px; }

#loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 300; justify-content: center; align-items: center; }
#loading.show { display: flex; }
.spinner { width: 44px; height: 44px; border: 3px solid rgba(201,168,76,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 500px) {
  .stats-mes { grid-template-columns: 1fr 1fr; }
  .cal-dia { min-height: 58px; padding: 4px; }
  .cal-dia-num { font-size: 11px; }
}
</style>
<script src="config.js"></script>
</head>
<body>

<div class="header">
  <div class="header-brand">📅 CALENDÁRIO</div>
  <div class="header-right">
    <a href="faturas.html" class="btn-top">🧾 Faturas</a>
    <a href="admin.html" class="btn-top">← Admin</a>
  </div>
</div>

<div class="main">
  <div class="mes-nav">
    <button class="btn-nav" onclick="mudarMes(-1)">‹</button>
    <div class="mes-titulo" id="mesTitulo"></div>
    <button class="btn-nav" onclick="mudarMes(1)">›</button>
  </div>

  <div class="legenda">
    <div class="leg-item"><div class="leg-dot faturas"></div> Faturas registadas</div>
    <div class="leg-item"><div class="leg-dot vendas"></div> Vendas do dia</div>
  </div>

  <div class="stats-mes">
    <div class="stat-card"><div class="stat-val" id="statFaturas">0</div><div class="stat-lbl">Faturas</div></div>
    <div class="stat-card"><div class="stat-val" id="statTotalFat">0 €</div><div class="stat-lbl">Total Faturas</div></div>
    <div class="stat-card"><div class="stat-val green" id="statVendas">0 €</div><div class="stat-lbl">Vendas s/IVA</div></div>
    <div class="stat-card"><div class="stat-val green" id="statIvaVendas">0 €</div><div class="stat-lbl">IVA Vendas</div></div>
  </div>

  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- MODAL DIA -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-title" id="modalTitulo"></div>
    <div class="modal-sub" id="modalSub"></div>
    <div id="modalConteudo"></div>
    <button class="btn-fechar" onclick="fecharModalDireto()">Fechar</button>
  </div>
</div>

<div id="loading"><div class="spinner"></div></div>

<script>
const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_PT  = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let anoActual  = new Date().getFullYear();
let mesActual  = new Date().getMonth();
let faturasMes = [];
let vendasMes  = [];

function setLoading(on) { document.getElementById('loading').classList.toggle('show', on); }

function mudarMes(delta) {
  mesActual += delta;
  if (mesActual < 0)  { mesActual = 11; anoActual--; }
  if (mesActual > 11) { mesActual = 0;  anoActual++; }
  carregarMes();
}

async function carregarMes() {
  const mesStr = anoActual + '-' + String(mesActual + 1).padStart(2, '0');
  document.getElementById('mesTitulo').textContent = MESES_PT[mesActual] + ' ' + anoActual;

  try {
    setLoading(true);
    const [resFat, resVendas] = await Promise.all([
      apiRequest('listarFaturas', { mes: mesStr }),
      apiRequest('listarVendas',  { mes: mesStr })
    ]);

    faturasMes = (resFat    && Array.isArray(resFat.faturas))   ? resFat.faturas   : [];
    vendasMes  = (resVendas && Array.isArray(resVendas.vendas)) ? resVendas.vendas : [];

    renderCalendario();
    renderStats();
  } catch(e) {
    console.error(e);
    faturasMes = [];
    vendasMes  = [];
    renderCalendario();
  } finally {
    setLoading(false);
  }
}

function renderStats() {
  const totalFat    = faturasMes.reduce((s, f) => s + (parseFloat(f.total)  || 0), 0);
  const totalVendas = vendasMes.reduce((s, v)  => s + (parseFloat(v.vendas) || 0), 0);
  const totalIva    = vendasMes.reduce((s, v)  => s + (parseFloat(v.iva)    || 0), 0);

  document.getElementById('statFaturas').textContent   = faturasMes.length;
  document.getElementById('statTotalFat').textContent  = totalFat.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('statVendas').textContent    = totalVendas.toFixed(2).replace('.', ',') + ' €';
  document.getElementById('statIvaVendas').textContent = totalIva.toFixed(2).replace('.', ',') + ' €';
}

function renderCalendario() {
  const grid = document.getElementById('calGrid');
  const hoje = new Date();

  // Agrupar faturas por dia
  const fatPorDia = {};
  faturasMes.forEach(f => {
    const dia = (f.data || '').split('T')[0];
    if (!fatPorDia[dia]) fatPorDia[dia] = { faturas: [], total: 0 };
    fatPorDia[dia].faturas.push(f);
    fatPorDia[dia].total += parseFloat(f.total) || 0;
  });

  // Agrupar vendas por dia
  const vendasPorDia = {};
  vendasMes.forEach(v => {
    const dia = (v.data || '').split('T')[0];
    vendasPorDia[dia] = v;
  });

  let html = DIAS_PT.map(d => `<div class="cal-header">${d}</div>`).join('');

  const primeiroDia = new Date(anoActual, mesActual, 1).getDay();
  const diasNoMes   = new Date(anoActual, mesActual + 1, 0).getDate();

  for (let i = 0; i < primeiroDia; i++) html += `<div class="cal-dia vazio"></div>`;

  for (let d = 1; d <= diasNoMes; d++) {
    const dataISO = anoActual + '-' + String(mesActual+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const isHoje  = anoActual === hoje.getFullYear() && mesActual === hoje.getMonth() && d === hoje.getDate();
    const fat     = fatPorDia[dataISO];
    const venda   = vendasPorDia[dataISO];
    const temDados = fat || venda;

    let fatHtml = '';
    if (fat) {
      fatHtml = `<div class="cal-fat">
        <div class="cal-fat-dot"></div>
        <div class="cal-fat-info">${fat.faturas.length}f · ${fat.total.toFixed(0)}€</div>
      </div>`;
    }

    let vendaHtml = '';
    if (venda) {
      vendaHtml = `<div class="cal-venda">
        <div class="cal-venda-dot"></div>
        <div class="cal-venda-info">${parseFloat(venda.vendas||0).toFixed(0)}€</div>
      </div>`;
    }

    html += `<div class="cal-dia${isHoje ? ' hoje' : ''}${temDados ? ' tem-dados' : ''}"
      onclick="${temDados ? `abrirDia('${dataISO}')` : ''}">
      <div class="cal-dia-num">${d}</div>
      ${fatHtml}
      ${vendaHtml}
    </div>`;
  }

  grid.innerHTML = html;
}

function abrirDia(dataISO) {
  const [y, m, d] = dataISO.split('-');
  document.getElementById('modalTitulo').textContent = d + ' de ' + MESES_PT[parseInt(m)-1] + ' ' + y;

  const fat   = faturasMes.filter(f => (f.data||'').split('T')[0] === dataISO);
  const venda = vendasMes.find(v => (v.data||'').split('T')[0] === dataISO);

  const partes = [];

  // Faturas
  if (fat.length) {
    const totalFat = fat.reduce((s, f) => s + (parseFloat(f.total)||0), 0);
    partes.push(`
      <div class="modal-section">
        <div class="modal-section-title faturas">🧾 Faturas (${fat.length})</div>
        ${fat.map(f => `
          <div class="fatura-item">
            <div class="fatura-header">
              <div class="fatura-numero">${f.numero || '—'}</div>
              <div class="fatura-total">${parseFloat(f.total||0).toFixed(2).replace('.',',')} €</div>
            </div>
            <div class="fatura-fornecedor">${f.fornecedor || '—'}</div>
            ${(f.base || f.iva) ? `<div class="fatura-detalhes">Base: ${parseFloat(f.base||0).toFixed(2)} € · IVA: ${parseFloat(f.iva||0).toFixed(2)} €</div>` : ''}
          </div>`).join('')}
        <div style="text-align:right;font-size:13px;color:#4caf82;font-weight:700;margin-top:4px">Total: ${totalFat.toFixed(2).replace('.',',')} €</div>
      </div>`);
  }

  // Vendas
  if (venda) {
    const vendasCIva   = parseFloat(venda.vendasCIva)  || 0;
    const vendasSIva   = parseFloat(venda.vendas)       || 0;
    const ivaVendas    = parseFloat(venda.ivaVendas)    || 0;
    const comprasBase  = parseFloat(venda.comprasBase)  || 0;
    const comprasIva   = parseFloat(venda.comprasIva)   || 0;
    const resultado    = parseFloat(venda.resultado)    || 0;
    const ivaLiquido   = parseFloat(venda.ivaLiquido)   || 0;
    partes.push(`
      <div class="modal-section">
        <div class="modal-section-title vendas">📈 Vendas do Dia</div>
        <div class="venda-card">
          <div class="venda-row"><span class="venda-key">Vendas c/IVA</span><span class="venda-val">${vendasCIva.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">Vendas s/IVA</span><span class="venda-val">${vendasSIva.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">IVA das vendas</span><span class="venda-val">${ivaVendas.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">Compras s/IVA</span><span class="venda-val" style="color:#e74c3c">− ${comprasBase.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">IVA das compras</span><span class="venda-val" style="color:#e74c3c">− ${comprasIva.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">Resultado (s/IVA)</span><span class="venda-val gold">${resultado.toFixed(2).replace('.',',')} €</span></div>
          <div class="venda-row"><span class="venda-key">IVA líquido a pagar</span><span class="venda-val gold">${ivaLiquido.toFixed(2).replace('.',',')} €</span></div>
        </div>
      </div>`);
  }

  // Sub info
  const infos = [];
  if (fat.length) infos.push(fat.length + (fat.length === 1 ? ' fatura' : ' faturas'));
  if (venda) infos.push('vendas registadas');
  document.getElementById('modalSub').textContent = infos.join(' · ');

  document.getElementById('modalConteudo').innerHTML = partes.join('') || '<p style="color:var(--text-muted);font-size:13px">Sem dados para este dia.</p>';
  document.getElementById('modalOverlay').classList.add('show');
}

function fecharModal(e) { if (e.target === document.getElementById('modalOverlay')) fecharModalDireto(); }
function fecharModalDireto() { document.getElementById('modalOverlay').classList.remove('show'); }

window.addEventListener('DOMContentLoaded', carregarMes);
</script>
</body>
</html>
